[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenny-growth-api"
version = "0.1.0"
description = "Lenny Growth Assistant API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "httpx>=0.28.0",
  "anthropic>=0.40.0",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.2",
  "tiktoken>=0.8.0",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI idiom: `Depends(...)` in parameter defaults
ignore = ["B008"]
